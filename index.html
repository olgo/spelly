<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/spelly/">

  <meta charset="UTF-8">
  <meta name="description" content="Spelly – Wortlegespiel für Freundeskreise">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Diese beiden Zeilen sind der Grund, warum die Web-App auf dem
       iPhone ohne Browserleiste startet. Ohne sie sieht sie nach dem
       Ablegen auf dem Home-Bildschirm immer noch aus wie eine Webseite. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- "black" statt "black-translucent", und kein viewport-fit=cover: Damit
       legt iOS die Statusleiste nicht über den Inhalt, sondern beginnt die
       Seite darunter. Das muss hier geregelt werden, weil Flutter Web die
       Geräteränder gar nicht kennt – die Engine baut ihre Ansicht mit fest
       genullten Rändern, SafeArea läuft dort also ins Leere. Ein fester Wert
       im Dart-Code wäre auch falsch: 20 Punkt beim SE, 47 mit Notch.
       Nebeneffekt: Unten bleibt der Bereich der Home-Leiste frei. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Der Name unter dem Symbol auf dem Home-Bildschirm. -->
  <meta name="apple-mobile-web-app-title" content="Spelly">

  <title>Spelly</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16232C">
  <!-- iOS liest Web-App-Icons ausschliesslich von hier, nie aus manifest.json.
       Deshalb die randlose "maskable"-Fassung statt Icon-192.png: Bei einem
       Icon mit transparenten Ecken füllt iOS die Transparenz selbst mit Weiss
       auf – sichtbar als weisser Rand auf dem Home-Bildschirm und im kurzen
       nativen Startbildschirm, bevor unsere eigene Ladeseite greift. -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- OneSignal Web SDK für Browser-Push (Web/iOS-PWA). -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      // Die App liegt auf GitHub Pages unter /spelly/, beim lokalen
      // `flutter run` dagegen unter /. OneSignal sucht seinen Service Worker
      // sonst im Wurzelverzeichnis, wo nichts liegt. Der Pfad kommt deshalb
      // aus dem <base>-Tag oben statt fest im Text zu stehen – ein fester
      // Wert würde eine der beiden Seiten kaputtmachen.
      const basis = new URL(document.baseURI).pathname;
      await OneSignal.init({
        appId: 'cec97100-f4a4-4d06-929b-80a2226fd8e4',
        serviceWorkerPath: (basis + 'OneSignalSDKWorker.js').replace(/^\//, ''),
        serviceWorkerParam: {scope: basis},
        // Ohne diese Angabe zeigt OneSignal seine eigene Einladung mit
        // Marketing-Wortlaut ("die neuesten Nachrichten und Angebote"), die
        // wie ein Newsletter aussieht und mit dem Spiel nichts zu tun hat.
        // Gefragt wird stattdessen nach der Anmeldung aus push.dart heraus –
        // dann kommt der schlichte Systemdialog, und es ist klar, worum es
        // geht. Im Dashboard ist dieselbe Aufforderung ebenfalls abgestellt;
        // das hier hält sie fern, falls sie dort je wieder angeklickt wird.
        promptOptions: {
          slidedown: {
            prompts: [{type: 'push', autoPrompt: false}],
          },
        },
      });
    });
  </script>

  <style>
    /* Verhindert das weisse Aufblitzen, bevor Flutter geladen hat – beim
       ersten Start wird die Wortliste mitgeladen, das dauert einen Moment. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #16232C;
      overscroll-behavior: none;
    }

    /* Ladebildschirm: ein Ausschnitt der Brett-Textur aus dem App-Icon,
       verwischt und abgedunkelt, füllt als Hintergrund das ganze Display
       (egal welches Seitenverhältnis) – und obendrauf, klein und scharf,
       dasselbe Icon als Symbol in der Mitte. */
    #ladehinweis {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #16232C;
    }
    #ladehinweis::before {
      content: "";
      position: absolute;
      inset: -10%;
      background: url('splash-texture.jpg') center / cover no-repeat;
      filter: blur(40px) brightness(0.6) saturate(1.15);
      transform: scale(1.2); /* überdeckt den unscharfen Rand, den blur() hinterlässt */
      z-index: 0;
    }
    #ladehinweis::after {
      /* Dunkler Verlauf über dem verwischten Hintergrund, damit Symbol,
         Spinner und Text auch auf hellen Bildausschnitten lesbar bleiben. */
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%,
        rgba(22, 35, 44, 0) 0%,
        rgba(19, 30, 38, 0.55) 60%,
        rgba(11, 17, 22, 0.92) 100%);
      z-index: 1;
    }
    #ladehinweis-inhalt {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 0 32px;
    }
    #ladehinweis-inhalt img {
      width: min(40vw, 172px);
      height: auto;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.5);
      animation: spelly-atmen 2.4s ease-in-out infinite;
    }
    #ladehinweis-spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(240, 178, 74, 0.2);
      border-top-color: #F0B24A; /* Palette.signal aus theme.dart */
      animation: spelly-dreh 0.8s linear infinite;
    }
    #ladehinweis-text {
      margin: 0;
      color: #B9C6CE;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    @keyframes spelly-dreh {
      to { transform: rotate(360deg); }
    }
    @keyframes spelly-atmen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      #ladehinweis-inhalt img,
      #ladehinweis-spinner {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="ladehinweis" role="status" aria-live="polite">
    <div id="ladehinweis-inhalt">
      <img src="icons/Icon-512.png" width="512" height="512" alt="">
      <div id="ladehinweis-spinner" aria-hidden="true"></div>
      <p id="ladehinweis-text">Spelly wird geladen</p>
    </div>
  </div>

  <script>
    // Sobald Flutter zeichnet, ist der Ladebildschirm überflüssig.
    window.addEventListener('flutter-first-frame', function () {
      const hint = document.getElementById('ladehinweis');
      if (hint) hint.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
